<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Ensures web content matches phone screen dimensions and prevents page zooming scaling errors -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- Grants standalone full-screen status hiding standard Safari navigation toolbars -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Minimalist Full-Screen Timer</title>
    <!-- Linking the PWA configuration manifesto for safe offline storage -->
    <link rel="manifest" href="manifest.json">
    <style>
        /* Base reset targeting mobile device interactions */
        * {
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            margin: 0;
            background-color: #000;
            color: #00ff00;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden;
        }

        /* Main layout controller framework centering variables */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
        }

        /* Ultra large high-contrast display numbers */
        #display {
            font-size: 18vw;
            font-variant-numeric: tabular-nums;
            font-weight: bold;
            margin-bottom: 50px;
            transition: opacity 0.5s;
        }

        /* Grid container parsing editing wheels layout inputs */
        #edit-mode {
            display: flex;
            gap: 10px;
            margin-bottom: 50px;
        }

        input {
            background: #222;
            color: #fff;
            border: none;
            font-size: 8vw;
            width: 18vw;
            text-align: center;
            border-radius: 10px;
            padding: 10px;
        }

        /* Button UI elements styling framework profiles */
        .btn-group {
            display: flex;
            gap: 40px;
        }

        button {
            font-size: 5vw;
            padding: 15px 40px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        #start-btn {
            background-color: #34c759;
            color: white;
        }

        #cancel-btn {
            background-color: #ff3b30;
            color: white;
            opacity: 0.5;
            pointer-events: none;
        }

        /* Core: 10-second automatic screen dimming overlay shield layer */
        #dim-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s;
            z-index: 999;
        }
    </style>
</head>
<body>

    <!-- Transparent interaction shield handling screen fading adjustments -->
    <div id="dim-overlay"></div>

    <div class="container">
        <!-- Interactive Editing Fields (Hidden when countdown runs active) -->
        <div id="edit-mode">
            <input type="number" id="hrs" value="0" min="0" max="23">
            <input type="number" id="mins" value="12" min="0" max="59">
            <input type="number" id="secs" value="0" min="0" max="59">
        </div>

        <!-- High-Contrast Massive Timer Display Layer -->
        <div id="display" style="display: none;">00:12:00</div>

        <!-- Execution Action Toggles Frame -->
        <div class="btn-group">
            <button id="start-btn">START</button>
            <button id="cancel-btn">CANCEL</button>
        </div>
    </div>

    <!-- Embedded audio engine backing backup alert chimes -->
    <audio id="alarm-sound" src="radar.mp3" loop></audio>

    <script>
        // Core execution runtime reference states
        let timer = null;
        let idleTimer = null;
        let totalSeconds = 0;
        let isRunning = false;
        let wakeLock = null;
        let alarmTimeout = null;

        // Document Object Model node maps
        const display = document.getElementById('display');
        const editMode = document.getElementById('edit-mode');
        const startBtn = document.getElementById('start-btn');
        const cancelBtn = document.getElementById('cancel-btn');
        const dimOverlay = document.getElementById('dim-overlay');
        const alarmSound = document.getElementById('alarm-sound');

        // Function to stop alarm sound and reset
        function stopAlarm() {
            alarmSound.pause();
            alarmSound.currentTime = 0;
            if (alarmTimeout) {
                clearTimeout(alarmTimeout);
                alarmTimeout = null;
            }
        }

        // --- 1. Prevent Phone Sleep (Screen Wake Lock API) ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) { console.log('Wake Lock assertion rejected:', err); }
        }

        function releaseWakeLock() {
            if (wakeLock) { wakeLock.release(); wakeLock = null; }
        }

        // --- 2. Smart 10-Second Auto Dimming Logic ---
        function resetIdleTimer() {
            // Restore screen brightness instantaneously
            dimOverlay.style.opacity = "0";
            clearTimeout(idleTimer);

            // Trigger 85% opacity black veil filter block after 10 seconds of structural silence
            idleTimer = setTimeout(() => {
                dimOverlay.style.opacity = "0.85";
            }, 10000);
        }

        // Global structural view listeners tracking interface engagement
        document.body.addEventListener('click', resetIdleTimer);
        document.body.addEventListener('touchstart', resetIdleTimer);

        // --- 3. Core Timer Thread Controls Engine ---
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Avoid triggering immediate dimming wake cycles on button click

            // Stop alarm if it's playing when restart is clicked
            stopAlarm();

            if (!isRunning) {
                // Initialize countdown parameters out of standard form variables values data
                if (startBtn.innerText === "START" || startBtn.innerText === "RESUME") {
                    if (startBtn.innerText === "START") {
                        const h = parseInt(document.getElementById('hrs').value) || 0;
                        const m = parseInt(document.getElementById('mins').value) || 0;
                        const s = parseInt(document.getElementById('secs').value) || 0;
                        totalSeconds = (h * 3600) + (m * 60) + s;

                        // Intercept empty countdown configurations cleanly
                        if (totalSeconds <= 0) return;

                        // Unlock audio for Safari/iOS by playing and immediately pausing
                        alarmSound.play().then(() => {
                            alarmSound.pause();
                            alarmSound.currentTime = 0;
                        }).catch(() => { });

                        // Dynamically swap user focus fields panels
                        editMode.style.display = 'none';
                        display.style.display = 'block';
                        cancelBtn.style.opacity = '1';
                        cancelBtn.style.pointerEvents = 'auto';
                    }
                }

                // Switch action toggle status definitions over to PAUSE runtime structures
                isRunning = true;
                startBtn.innerText = "PAUSE";
                startBtn.style.backgroundColor = "#ff9500";

                requestWakeLock();
                updateDisplay();
                timer = setInterval(tick, 1000);
            } else {
                // Switch interface state representation mapping down to standard pause configuration profiles
                isRunning = false;
                startBtn.innerText = "RESUME";
                startBtn.style.backgroundColor = "#34c759";
                clearInterval(timer);
                releaseWakeLock();
            }
        });

        cancelBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            clearInterval(timer);
            stopAlarm();
            isRunning = false;

            // Clean view restoration updates mapping
            editMode.style.display = 'flex';
            display.style.display = 'none';
            startBtn.innerText = "START";
            startBtn.style.backgroundColor = "#34c759";
            startBtn.style.display = 'block'; // Show START button again
            cancelBtn.innerText = 'CANCEL'; // Reset button text
            cancelBtn.style.opacity = '0.5';
            cancelBtn.style.pointerEvents = 'none';
            releaseWakeLock();
        });

        function tick() {
            if (totalSeconds <= 0) {
                clearInterval(timer);
                isRunning = false;

                // Hide START button and change CANCEL to CONFIRM
                startBtn.style.display = 'none';
                cancelBtn.innerText = 'CONFIRM';

                // Fire audio asset alert with local synthesized browser audio context fallback tracking security overrides
                alarmSound.play().catch(() => {
                    let ctx = new (window.AudioContext || window.webkitAudioContext)();
                    let osc = ctx.createOscillator();
                    osc.connect(ctx.destination);
                    osc.start();
                    setTimeout(() => osc.stop(), 2000);
                });

                // Stop alarm after 30 seconds (30000ms)
                alarmTimeout = setTimeout(() => {
                    alarmSound.pause();
                    alarmSound.currentTime = 0;
                }, 30000);
            } else {
                totalSeconds--;
                updateDisplay();
            }
        }

        function updateDisplay() {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            display.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        // Initialize 10s inactivity tracking cycle initialization profile loops configurations
        resetIdleTimer();

        // --- 4. Service Worker Background Operations Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Offline PWA Service Worker Registered:', reg))
                    .catch(err => console.log('Offline PWA Registration Failed:', err));
            });
        }
    </script>
</body>
</html>
